openapi: 3.1.0
info:
  title: TicketApp API
  version: "1.0.0"
  description: >-
    Machine-readable specification of the TicketApp API, generated by reading
    the real repository code only (app/api/**/route.ts, lib/validations.ts,
    lib/permissions.ts). 107 of 109 operations require an Auth.js browser
    session cookie (cookieAuth) — there is no API key or OAuth
    client-credentials mechanism today. See docs/api/AUTHENTICATION.md and
    docs/api/EXTERNAL_API_READINESS.md before assuming any endpoint here is
    safe for external/machine-to-machine use. x-internal:true marks
    operations that are not a stable, documented business API (the Auth.js
    catch-all, the SSE stream). Ambiguous/dynamic response shapes use a
    generic object schema with a `x-source` file reference rather than
    invented fields.
servers:
  - url: http://localhost:3000
    description: Local development
security:
  - cookieAuth: []
tags:
  - name: Auth
    description: Auth.js session/OAuth catch-all
  - name: Tickets
  - name: Projects
  - name: Activities
  - name: Dependencies
  - name: Goals
  - name: Users
  - name: Departments
  - name: DepartmentConfig
    description: Ticket statuses/categories/priorities/cancel-reasons, SLA, Activity Progress/Status config
  - name: Attachments
  - name: Microsoft
  - name: Email
    description: Inbound email webhook and admin email diagnostics
  - name: Notifications
  - name: Dashboard
  - name: Workspace
  - name: Roles

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: authjs.session-token
      description: Auth.js JWT session cookie. Obtained only via interactive browser login (Microsoft Entra ID SSO or the credentials form) — there is no programmatic way to obtain one.
    bearerAuth:
      type: http
      scheme: bearer
      description: Static shared secret (EMAIL_WEBHOOK_SECRET or CRON_SECRET), used only by /api/email/inbound. Fails open (accepts everyone) if neither secret is configured — see docs/api/AUTHENTICATION.md.

  schemas:
    ErrorContractA:
      type: object
      description: Structured error contract (lib/api-errors.ts) — used only by the 7 admin config domains (statuses/categories/priorities/cancel-reasons/sla/activity-progress/activity-statuses).
      properties:
        code: { type: string }
        error: { type: string, description: "Identical to message, kept for backward compatibility" }
        message: { type: string }
        field: { type: string }
        fieldErrors: { type: object, additionalProperties: { type: string } }
      required: [code, error, message]
    ErrorContractBString:
      type: object
      description: Legacy raw contract — most routes. error is a plain string for non-validation failures.
      properties:
        error: { type: string }
        code: { type: string, description: "Present only on some hand-written error paths, not guaranteed" }
      required: [error]
    ErrorContractBZodArray:
      type: object
      description: Legacy raw contract on 422 validation failures — error is a raw array of Zod issues, NOT a string. See docs/api/ERROR_CODES.md.
      properties:
        error:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              path: { type: array, items: {} }
              message: { type: string }
      required: [error]
    GenericEntity:
      type: object
      description: Dynamic/full-relation response shape not exhaustively modeled here — see the referenced source file for the exact fields returned.
      additionalProperties: true
    PaginationMeta:
      type: object
      properties:
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
        totalPages: { type: integer }

  responses:
    Unauthorized401:
      description: No/invalid session (or, for /api/email/inbound, missing/invalid Bearer token)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorContractBString" }
    Forbidden403:
      description: Authenticated but missing the required permission/department standing
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorContractBString" }
    NotFound404:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorContractBString" }
    ZodValidation422:
      description: Zod validation failure (Contract B — raw ZodIssue[] array under `error`, NOT a string)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorContractBZodArray" }
    InternalError500:
      description: Generic, safe server error (never a raw Prisma/SQL message)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorContractBString" }

paths:
  /api/tickets:
    get:
      tags: [Tickets]
      summary: List/search/filter tickets
      operationId: listTickets
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
        - { name: search, in: query, schema: { type: string } }
        - { name: statusId, in: query, schema: { type: string } }
        - { name: priorityId, in: query, schema: { type: string } }
        - { name: categoryId, in: query, schema: { type: string } }
        - { name: assignedAgentId, in: query, schema: { type: string } }
        - { name: departmentId, in: query, schema: { type: string } }
        - { name: subDepartmentId, in: query, schema: { type: string } }
        - { name: source, in: query, schema: { type: string, enum: [WEB, EMAIL] } }
        - { name: createdAfter, in: query, schema: { type: string, format: date-time } }
        - { name: createdBefore, in: query, schema: { type: string, format: date-time } }
        - { name: sortBy, in: query, schema: { type: string, enum: [createdAt, updatedAt, priority, status], default: createdAt } }
        - { name: sortDir, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
        - { name: unassigned, in: query, schema: { type: boolean } }
        - { name: myOnly, in: query, schema: { type: boolean } }
        - { name: projectId, in: query, schema: { type: string } }
        - { name: activityId, in: query, schema: { type: string } }
      responses:
        "200":
          description: Paginated ticket list
          content:
            application/json:
              schema:
                type: object
                properties:
                  tickets: { type: array, items: { $ref: "#/components/schemas/GenericEntity" } }
                  total: { type: integer }
                  page: { type: integer }
                  limit: { type: integer }
                  totalPages: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized401" }
        "403": { $ref: "#/components/responses/Forbidden403" }
    post:
      tags: [Tickets]
      summary: Create ticket
      operationId: createTicket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, description]
              properties:
                title: { type: string, minLength: 5, maxLength: 200 }
                description: { type: string, minLength: 10 }
                categoryId: { type: string }
                priorityId: { type: string }
                departmentId: { type: string, description: "Optional — falls back to active-workspace cookie, then resolveDepartmentForCreate" }
                subDepartmentId: { type: string }
                projectId: { type: string, description: "Linking requires Role.ADMIN" }
                activityId: { type: string, description: "Linking requires Role.ADMIN" }
                shareWithDepartment: { type: boolean, default: false }
                shareWithSubDepartment: { type: boolean, default: false }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/GenericEntity" } } } }
        "400": { $ref: "#/components/responses/Forbidden403" }
        "403": { $ref: "#/components/responses/Forbidden403" }
        "422": { $ref: "#/components/responses/ZodValidation422" }
        "500": { $ref: "#/components/responses/InternalError500" }

  /api/tickets/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Tickets]
      summary: Get ticket
      operationId: getTicket
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/GenericEntity" } } } }
        "401": { $ref: "#/components/responses/Unauthorized401" }
        "403": { $ref: "#/components/responses/Forbidden403" }
        "404": { $ref: "#/components/responses/NotFound404" }
    patch:
      tags: [Tickets]
      summary: Update ticket (generic fields — see docs/api/API_REFERENCE.md for the dedicated status/assign/department/cancel sub-routes)
      operationId: updateTicket
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
                categoryId: { type: string, nullable: true }
                priorityId: { type: string, nullable: true }
                statusId: { type: string }
                assignedAgentId: { type: string, nullable: true }
                cancelReasonId: { type: string, nullable: true }
                projectId: { type: string, nullable: true }
                activityId: { type: string, nullable: true }
                shareWithDepartment: { type: boolean }
                shareWithSubDepartment: { type: boolean }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/GenericEntity" } } } }
        "403": { $ref: "#/components/responses/Forbidden403" }
        "404": { $ref: "#/components/responses/NotFound404" }
        "422": { $ref: "#/components/responses/ZodValidation422" }
        "500": { $ref: "#/components/responses/InternalError500" }
    delete:
      tags: [Tickets]
      summary: Delete ticket (Administrator only, hard delete)
      operationId: deleteTicket
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized401" }
        "403": { $ref: "#/components/responses/Forbidden403" }
        "404": { $ref: "#/components/responses/NotFound404" }

  /api/tickets/{id}/status:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    patch:
      tags: [Tickets]
      summary: Change ticket status
      operationId: changeTicketStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [statusId]
              properties:
                statusId: { type: string }
                cancelReasonId: { type: string }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/GenericEntity" } } } }
        "403": { $ref: "#/components/responses/Forbidden403" }
        "404": { $ref: "#/components/responses/NotFound404" }
        "422": { $ref: "#/components/responses/ZodValidation422" }

  /api/tickets/{id}/assign:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    patch:
      tags: [Tickets]
      summary: Assign/unassign agent
      operationId: assignTicket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignedAgentId]
              properties:
                assignedAgentId: { type: string, nullable: true }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/GenericEntity" } } } }
        "400": { description: "assignee_not_assignable" }
        "403": { $ref: "#/components/responses/Forbidden403" }
        "404": { $ref: "#/components/responses/NotFound404" }

  /api/tickets/{id}/department:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    patch:
      tags: [Tickets]
      summary: Move ticket to another department/sub-department (owner does NOT bypass this permission)
      operationId: changeTicketDepartment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [departmentId]
              properties:
                departmentId: { type: string }
                subDepartmentId: { type: string, nullable: true }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/GenericEntity" } } } }
        "400": { description: "subdepartment_department_mismatch" }
        "403": { description: "missing_permission / invalid_department" }
        "404": { description: "ticket_not_found / invalid_department" }
        "422": { $ref: "#/components/responses/ZodValidation422" }

  /api/tickets/{id}/cancel:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      tags: [Tickets]
      summary: Cancel ticket
      operationId: cancelTicket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cancelReasonId]
              properties:
                cancelReasonId: { type: string }
                note: { type: string, maxLength: 1000 }
      responses:
        "200": { description: OK }
        "403": { $ref: "#/components/responses/Forbidden403" }
        "404": { $ref: "#/components/responses/NotFound404" }
        "409": { description: "Ticket is already cancelled/closed" }
        "422": { description: "Cancel reason not found or inactive" }

  /api/tickets/{id}/reply:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      tags: [Tickets]
      summary: Add comment/reply/internal note
      operationId: replyToTicket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1 }
                direction: { type: string, enum: [INBOUND, OUTBOUND, INTERNAL_NOTE], default: OUTBOUND }
                isInternal: { type: boolean, default: false }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/GenericEntity" } } } }
        "403": { $ref: "#/components/responses/Forbidden403" }
        "404": { $ref: "#/components/responses/NotFound404" }
        "422": { $ref: "#/components/responses/ZodValidation422" }

  /api/tickets/{id}/attachments:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      tags: [Attachments]
      summary: Upload ticket attachment
      description: >-
        x-warning: the stored file is served from public/uploads/{ticketId}/{filename},
        entirely outside the Auth.js middleware — the returned `path` is an
        UNAUTHENTICATED static URL. See docs/api/EXTERNAL_API_READINESS.md §3.
      operationId: uploadTicketAttachment
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: "max 10MB; allowed MIME: image/jpeg,png,gif,webp, application/pdf, msword, docx, xls, xlsx, text/plain, zip" }
                messageId: { type: string }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/GenericEntity" } } } }
        "400": { description: "No file / file too large / disallowed MIME type" }
        "403": { $ref: "#/components/responses/Forbidden403" }
        "404": { $ref: "#/components/responses/NotFound404" }
        "500": { description: "Upload failed (generic catch-all)" }

  /api/tickets/{id}/stream:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      tags: [Tickets]
      x-internal: true
      summary: Real-time Server-Sent-Events ticket stream (not a normal REST resource)
      operationId: ticketEventStream
      responses:
        "200":
          description: text/event-stream, permanent connection
          content:
            text/event-stream: { schema: { type: string } }
        "401": { description: Unauthorized }
        "403": { description: Forbidden }
        "404": { description: Not found }

  /api/tickets/pending/{id}/accept:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      tags: [Tickets]
      summary: Accept a pending (email-originated) ticket into a real Ticket
      operationId: acceptPendingTicket
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                departmentId: { type: string, nullable: true }
      responses:
        "200": { description: OK — the new Ticket, content: { application/json: { schema: { $ref: "#/components/schemas/GenericEntity" } } } }
        "400": { description: invalid_department }
        "403": { description: missing_permission }
        "404": { description: ticket_not_found }
        "409": { description: already_accepted / already_rejected }
        "422": { $ref: "#/components/responses/ZodValidation422" }

  /api/tickets/pending/{id}/reject:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      tags: [Tickets]
      summary: Reject a pending ticket
      operationId: rejectPendingTicket
      responses:
        "200": { description: "{ok:true}" }
        "403": { description: missing_permission }
        "404": { description: ticket_not_found }
        "409": { description: already_accepted / already_rejected }

  /api/projects:
    get:
      tags: [Projects]
      summary: List/search/filter projects
      operationId: listProjects
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
        - { name: search, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [PLANNING, IN_PROGRESS, ON_HOLD, COMPLETED, CANCELLED] } }
        - { name: departmentId, in: query, schema: { type: string } }
        - { name: subDepartmentId, in: query, schema: { type: string } }
      responses:
        "200":
          description: Paginated project list
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects: { type: array, items: { $ref: "#/components/schemas/GenericEntity" } }
                  total: { type: integer }
                  page: { type: integer }
                  totalPages: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized401" }
        "403": { $ref: "#/components/responses/Forbidden403" }
    post:
      tags: [Projects]
      summary: Create project
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, minLength: 3, maxLength: 200 }
                description: { type: string }
                status: { type: string, enum: [PLANNING, IN_PROGRESS, ON_HOLD, COMPLETED, CANCELLED], default: PLANNING }
                priority: { type: integer, minimum: 1, maximum: 3, default: 2 }
                departmentId: { type: string }
                subDepartmentId: { type: string, nullable: true }
                businessUnitId: { type: string }
                startDate: { type: string, format: date }
                endDate: { type: string, format: date }
                successTarget: { type: string }
                memberIds: { type: array, items: { type: string }, default: [] }
                isGoal: { type: boolean, default: false }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/GenericEntity" } } } }
        "422": { $ref: "#/components/responses/ZodValidation422" }
        "500": { $ref: "#/components/responses/InternalError500" }

  /api/projects/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      tags: [Projects]
      summary: Get project
      operationId: getProject
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/GenericEntity" } } } }
        "401": { $ref: "#/components/responses/Unauthorized401" }
        "403": { $ref: "#/components/responses/Forbidden403" }
        "404": { $ref: "#/components/responses/NotFound404" }
    patch:
      tags: [Projects]
      summary: Update project
      operationId: updateProject
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenericEntity" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/GenericEntity" } } } }
        "403": { $ref: "#/components/responses/Forbidden403" }
        "404": { $ref: "#/components/responses/NotFound404" }
        "422": { $ref: "#/components/responses/ZodValidation422" }
    delete:
      tags: [Projects]
      summary: Delete project (Administrator only — safe cascade, no child rows destroyed)
      operationId: deleteProject
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized401" }
        "403": { $ref: "#/components/responses/Forbidden403" }
        "404": { $ref: "#/components/responses/NotFound404" }

  /api/activities:
    get:
      tags: [Activities]
      summary: "List/search/filter activities — NO PAGINATION (returns every matching row)"
      operationId: listActivities
      parameters:
        - { name: projectId, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [TODO, IN_PROGRESS, ON_HOLD, BLOCKED, COMPLETED, CANCELLED] } }
        - { name: assignedUserId, in: query, schema: { type: string } }
        - { name: departmentId, in: query, schema: { type: string } }
        - { name: subDepartmentId, in: query, schema: { type: string } }
      responses:
        "200":
          description: Raw array, unbounded
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/GenericEntity" } }
        "401": { $ref: "#/components/responses/Unauthorized401" }
        "403": { $ref: "#/components/responses/Forbidden403" }
    post:
      tags: [Activities]
      summary: Create activity (standalone or inside a project)
      operationId: createActivity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, minLength: 3, maxLength: 200 }
                description: { type: string }
                projectId: { type: string, nullable: true }
                status: { type: string, enum: [TODO, IN_PROGRESS, ON_HOLD, BLOCKED, COMPLETED, CANCELLED], default: TODO }
                priority: { type: string, enum: [LOW, MEDIUM, HIGH, URGENT], default: MEDIUM }
                assignedUserIds: { type: array, items: { type: string }, default: [] }
                departmentId: { type: string }
                subDepartmentId: { type: string, nullable: true }
                businessUnitId: { type: string }
                startDate: { type: string, format: date }
                dueDate: { type: string, format: date }
                isCompleted: { type: boolean, default: false }
                isMilestone: { type: boolean }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/GenericEntity" } } } }
        "400": { description: "project-department mismatch" }
        "404": { description: "Project not found" }
        "409": { description: configuration_required }
        "422": { $ref: "#/components/responses/ZodValidation422" }

  /api/activities/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      tags: [Activities]
      summary: Get activity (progress/statusLabel/statusColor computed fresh on every read)
      operationId: getActivity
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/GenericEntity" } } } }
        "401": { $ref: "#/components/responses/Unauthorized401" }
        "403": { $ref: "#/components/responses/Forbidden403" }
        "404": { $ref: "#/components/responses/NotFound404" }
    patch:
      tags: [Activities]
      summary: "Update activity — `progress` is never client-settable, always server-derived from status"
      operationId: updateActivity
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenericEntity" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/GenericEntity" } } } }
        "400": { description: "invalid_date_range / invalid_status_transition / invalid_project_scope / assignee_not_assignable / subdepartment_department_mismatch" }
        "403": { description: "missing_permission" }
        "404": { description: "activity_not_found / project_not_found" }
        "409": { description: configuration_required }
        "422": { $ref: "#/components/responses/ZodValidation422" }
    delete:
      tags: [Activities]
      summary: Delete activity (Administrator only — safe cascade)
      operationId: deleteActivity
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized401" }
        "403": { $ref: "#/components/responses/Forbidden403" }
        "404": { $ref: "#/components/responses/NotFound404" }

  /api/dependencies:
    get:
      tags: [Dependencies]
      summary: List activity dependencies
      operationId: listDependencies
      parameters:
        - { name: activityId, in: query, schema: { type: string } }
      responses:
