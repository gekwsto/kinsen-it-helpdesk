        "403": { $ref: "#/components/responses/Forbidden403" }
    post:
      tags: [Dependencies]
      summary: Create activity dependency (Administrator only, BFS cycle detection)
      operationId: createDependency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [predecessorId, successorId]
              properties:
                predecessorId: { type: string }
                successorId: { type: string }
                type: { type: string, enum: [FINISH_TO_START, START_TO_START, FINISH_TO_FINISH, START_TO_FINISH], default: FINISH_TO_START }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/GenericEntity" } } } }
        "400": { description: "self-dependency" }
        "401": { $ref: "#/components/responses/Unauthorized401" }
        "403": { $ref: "#/components/responses/Forbidden403" }
        "404": { description: "predecessor/successor not found" }
        "409": { description: "would create a cycle" }

